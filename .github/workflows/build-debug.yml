name: Build Poco X5 Pro Debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install build tools & dependencies
        run: |
          sudo apt update
          sudo apt -y install ninja-build meson nasm gperf pkg-config yasm
          rustup target add aarch64-linux-android

      - name: Setup Android NDK r27c
        uses: nttld/setup-ndk@v1.4.2
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Install NDK 27.2.12479018
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build ARM64 Debug APK
        run: |
          vars=gradle.properties
          echo "DUMMY_CONST=0" >> $vars
          echo "org.gradle.workers.max=2" >> $vars
          echo "CHECK_UPDATES=0" >> $vars

          ./gradlew :TMessagesProj_App:assembleForkTestDebug -Parm64-v8a --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output_apk
          find TMessagesProj_App/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/ \;
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poco-X5-Pro-Debug-APK
          path: output_apk/*.apk
          retention-days: 7
